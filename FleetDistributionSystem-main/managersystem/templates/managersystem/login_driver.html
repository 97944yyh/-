{% extends "managersystem/base.html" %}

{% block content %}
<div class="headerdiv text-center">
    <h1 class="h3 headertext">司机登录</h1>
    <p class="text-muted mb-0">请输入工号与手机号进行验证。</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">司机工号</label>
                        <input type="text" class="form-control" name="driver_id" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">手机号</label>
                        <input type="text" class="form-control" name="phone" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">登录</button>
                </form>
            </div>
        </div>
        <p class="text-muted text-center mt-3 mb-0">
            部门主管请使用右上角“部门主管登录”。
        </p>
    </div>
</div>
{% endblock %}
